[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-receptionist"
version = "0.1.0"
description = "Multi-tenant AI receptionist — one LangGraph brain, two channels (voice + chat)."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2.60",
    "langgraph-checkpoint>=2.0",
    "langchain-core>=0.3.29",
    "langchain-groq>=0.2.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "rich>=13.9",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Config-level fallback model for hard multi-tool turns (see plan §17).
openai = ["langchain-openai>=0.2.14"]
# Google Gemini — higher free-tier limits than Groq (see .env.example).
# Needs the 4.x line for Gemini 3.x "thought signature" support (older versions
# fail multi-turn tool calls with a 400). That pulls langchain-core>=1.x, whose
# `uuid_utils` dependency has newer builds (0.16+) blocked by some Windows
# Application Control policies — so we cap it below the blocked builds. 0.12-0.15
# satisfy core's >=0.12 and load fine. Harmless elsewhere (Linux deploy ignores).
google = [
    "langchain-google-genai>=4.0",
    'uuid-utils>=0.12,<0.16; sys_platform == "win32"',
]
# Phase 6 — long-tail tools. >=0.3 is a hard floor, not a preference: 0.3.0 is
# the first release requiring langchain-core>=1.0, and this repo is on core
# 1.5.0 — a looser `>=0.1` pin can resolve to a pre-0.3 release built against
# core 0.3.x and silently downgrade the whole stack, the exact failure mode
# CLAUDE.md already records for the `google` extra. Verified live (Phase 6
# Step 0): the adapter's own dependency chain (mcp -> jsonschema -> rpds-py,
# pyjwt[crypto] -> cryptography, pywin32 on win32) installs and imports
# cleanly on this box, but app/mcp/client.py still imports it lazily and
# degrades to no MCP tools on ImportError, since that isn't guaranteed on
# every box (see the uuid_utils gotcha above).
# `mcp<2.0` is an explicit ceiling of our own, not langchain-mcp-adapters's:
# it declares only `mcp>=1.24.0` with no upper bound, so a fresh install pulls
# whatever's newest today. `mcp` 2.0.0 (released after Phase 8) restructured
# `mcp.shared.context` and dropped `RequestContext` from it, which
# `langchain_mcp_adapters.callbacks` imports at module load — breaking every
# import of `langchain_mcp_adapters.client`, and with it every test that
# monkeypatches `langchain_mcp_adapters.client.MultiServerMCPClient` by string
# path (tests/test_mcp_loader.py, tests/test_tenant_isolation.py's isolation
# test). Invisible on this dev box (mcp 1.28.1 was already installed before
# 2.0.0 existed); CI's fresh install had no such history.
mcp = ["langchain-mcp-adapters>=0.3", "mcp<2.0"]
# Durable conversation memory (Phase 4 Step 7). Optional and self-degrading:
# app/brain/graph.py falls back to InMemorySaver with a WARNING if this
# isn't installed, so a blocked compiled DLL (see the uuid_utils gotcha
# above) only costs conversation durability, never the app. Needs the
# Supavisor SESSION-mode pooler URI in DATABASE_URL, not the direct host —
# see app/db/checkpointer.py.
postgres = [
    "langgraph-checkpoint-postgres>=3.0",
    "psycopg[binary,pool]>=3.2",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Pinned exact, not a floor: CI runs a fresh `pip install` every time, so
    # an open-ended `>=0.8` silently installs whatever's newest *today* —
    # the same class of drift CLAUDE.md already documents twice
    # (uuid_utils, the [google] extra). A ruff release after 0.15.22 added
    # `ruff format`'s Python-code-fence handling inside Markdown files,
    # which started reformatting the illustrative snippets in plans/*.md —
    # invisible locally (an older ruff was already installed) and silently
    # broke CI's `ruff format --check .` for every commit since, unnoticed.
    "ruff==0.15.22",
]
# `langgraph dev` — LangGraph Studio against langgraph.json.
studio = ["langgraph-cli[inmem]>=0.1.55"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Markdown files (plans/*.md, CLAUDE.md, ...) hold illustrative Python
# snippets for readability, not real source — they're not imported, not
# tested, and have no business being held to ruff's exact formatting
# opinion. Newer ruff releases format Python code fences inside Markdown by
# default; excluding these means a future version bump can't silently break
# CI over a doc snippet again, regardless of the exact-pin above.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI/LangChain-style callables in defaults
