[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-receptionist"
version = "0.1.0"
description = "Multi-tenant AI receptionist — one LangGraph brain, two channels (voice + chat)."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2.60",
    "langgraph-checkpoint>=2.0",
    "langchain-core>=0.3.29",
    "langchain-groq>=0.2.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "rich>=13.9",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Config-level fallback model for hard multi-tool turns (see plan §17).
openai = ["langchain-openai>=0.2.14"]
# Google Gemini — higher free-tier limits than Groq (see .env.example).
# Needs the 4.x line for Gemini 3.x "thought signature" support (older versions
# fail multi-turn tool calls with a 400). That pulls langchain-core>=1.x, whose
# `uuid_utils` dependency has newer builds (0.16+) blocked by some Windows
# Application Control policies — so we cap it below the blocked builds. 0.12-0.15
# satisfy core's >=0.12 and load fine. Harmless elsewhere (Linux deploy ignores).
google = [
    "langchain-google-genai>=4.0",
    'uuid-utils>=0.12,<0.16; sys_platform == "win32"',
]
# Phase 6 — long-tail tools. >=0.3 is a hard floor, not a preference: 0.3.0 is
# the first release requiring langchain-core>=1.0, and this repo is on core
# 1.5.0 — a looser `>=0.1` pin can resolve to a pre-0.3 release built against
# core 0.3.x and silently downgrade the whole stack, the exact failure mode
# CLAUDE.md already records for the `google` extra. Verified live (Phase 6
# Step 0): the adapter's own dependency chain (mcp -> jsonschema -> rpds-py,
# pyjwt[crypto] -> cryptography, pywin32 on win32) installs and imports
# cleanly on this box, but app/mcp/client.py still imports it lazily and
# degrades to no MCP tools on ImportError, since that isn't guaranteed on
# every box (see the uuid_utils gotcha above).
mcp = ["langchain-mcp-adapters>=0.3"]
# Durable conversation memory (Phase 4 Step 7). Optional and self-degrading:
# app/brain/graph.py falls back to InMemorySaver with a WARNING if this
# isn't installed, so a blocked compiled DLL (see the uuid_utils gotcha
# above) only costs conversation durability, never the app. Needs the
# Supavisor SESSION-mode pooler URI in DATABASE_URL, not the direct host —
# see app/db/checkpointer.py.
postgres = [
    "langgraph-checkpoint-postgres>=3.0",
    "psycopg[binary,pool]>=3.2",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
# `langgraph dev` — LangGraph Studio against langgraph.json.
studio = ["langgraph-cli[inmem]>=0.1.55"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI/LangChain-style callables in defaults
