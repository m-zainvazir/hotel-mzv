name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      # No Node/npm step here on purpose: tests/test_widget_bundle.py
      # already catches dist/-vs-src/ drift in Python (see widget/README.md
      # for why Phase 5 chose that design over a JS build step in CI).
      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the deploy image
        run: docker build -f infra/Dockerfile -t ai-receptionist:ci .
